# Validated against the full suite on this exact set: 355 passed / 2 skipped
# (notably under pandas 3.x / numpy 2.5 — newer majors than dev used).
#
# Protocol (fail-closed):
#   • CI installs THIS file, never the open ranges in requirements.txt.
#   • requirements.txt stays the intent spec (floor ranges); this lock is the
#     reproducible reality. tests/test_dependency_lock.py pins the two together
#     in the same pytest run as the rest of the suite — a range bump without a
#     lock refresh fails CI.
#   • To refresh: fresh venv → `pip install -r requirements.txt` → run the full
#     pytest suite against it → `pip freeze --all | grep -v 'pip=='` → replace
#     the pins below (keep this header) in the same PR.
#   • pytest / pip-audit are CI-only tools and are intentionally NOT locked
#     here; install them beside the lock in the job that needs them.
#   • Platform note: locked for CPython 3.12 on linux (CI) and macOS (dev);
#     Windows is not a supported target.
