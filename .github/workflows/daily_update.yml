name: Daily Data Autopilot

# Keeps the board on the current NFL week and fresh feeds without manual work:
# nflverse refresh -> week rollover resolution -> model projections (src/week1.py)
# -> viewer slate files -> feeds/slate-index.json manifest -> commit -> Vercel
# auto-deploys. Idempotent: when nothing changed, nothing is committed.
#
# Provider keys are OPTIONAL (repo secrets) and only unlock more automation:
#   ODDS_API_KEY          The Odds API player props (PAID tier — see src/odds.py
#                         for the credit cost model). Without it the board ships
#                         fair lines only, exactly like the manual fallback.
#   BALLDONTLIE_API_KEY   balldontlie NBA schedules (free tier) — adds NBA
#                         date slates automatically via the manifest.
#
# Cadence: 11:00 UTC (07:00 ET, morning rollover check) and 21:00 UTC
# (17:00 ET, catches afternoon injury reports before the evening slates).
# GitHub cron is UTC-only; the pipeline itself resolves the active week from
# the schedule. The extra EST Sunday run below preserves the 12:45 ET check.

on:
  workflow_call:
    inputs:
      nba_only:
        type: boolean
        default: false
  schedule:
    # Daily baseline: 11:00 UTC (07:00 ET morning rollover) and 21:00 UTC (17:00 ET afternoon check)
    - cron: '0 11 * * *'
    - cron: '0 21 * * *'
    # Game-day live kickoff windows:
    # Sunday early window in EDT (11:30 ET / 15:30 UTC inactives + 12:45 ET / 16:45 UTC pre-kickoff line lock)
    - cron: '30 15 * * 0'
    - cron: '45 16 * * 0'
    # 12:45 ET in EST; skipped during EDT by the window guard below.
    - cron: '45 17 * * 0'
    # Sunday late window (15:30 ET / 19:30 UTC afternoon inactives)
    - cron: '30 19 * * 0'
    # Sunday Night Football pre-kickoff (19:45 ET / 23:45 UTC)
    - cron: '45 23 * * 0'
    # Thursday Night Football pre-kickoff (19:30 ET / 23:30 UTC)
    - cron: '30 23 * * 4'
    # Monday Night Football pre-kickoff (19:30 ET / 23:30 UTC)
    - cron: '30 23 * * 1'
  workflow_dispatch:
    inputs:
      nba_only:
        description: 'Refresh today’s NBA schedule and unverified FanDuel points lines only (max 20 credits)'
        type: boolean
        default: false

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check EST pre-kickoff window
        id: window
        run: |
          if [ "${{ github.event.schedule }}" = '45 17 * * 0' ] && [ "$(TZ=America/New_York date +%z)" != '-0500' ]; then
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.window.outputs.should_run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install model stack
        if: steps.window.outputs.should_run == 'true' && inputs.nba_only != true
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2" "numpy>=1.26" "scipy>=1.13" \
            "scikit-learn>=1.5" "statsmodels>=0.14" "pyarrow>=16" "requests>=2.32"

      - name: Install NBA contract dependency
        if: steps.window.outputs.should_run == 'true' && inputs.nba_only == true
        run: python -m pip install "pydantic>=2,<3"

      - name: Run autopilot
        if: steps.window.outputs.should_run == 'true' && inputs.nba_only != true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          NBA_ODDS_API_KEY: ${{ secrets.NBA_ODDS_API_KEY }}
        run: python scripts/autopilot.py --run

      - name: Refresh today's NBA market slate
        if: steps.window.outputs.should_run == 'true' && inputs.nba_only == true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          NBA_DATE=$(TZ=America/New_York date +%F)
          echo "Refreshing NBA market slate for $NBA_DATE Eastern"
          PYTHONPATH=. python scripts/fetch_nba_odds.py --dates "$NBA_DATE" --max-credits 20
          if [ -f "viewer/nba_games_$NBA_DATE.json" ]; then
            python scripts/publish_nba_market_slate.py "$NBA_DATE"
          else
            echo "No NBA games scheduled for $NBA_DATE Eastern."
          fi

      - name: Commit and push refreshed slate (if changed)
        if: steps.window.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            viewer/feeds \
            'viewer/games_*_w*.json' \
            'viewer/slate_*_w*.json' \
            'viewer/current_picks*_w*.json' \
            'viewer/current_picks.json' \
            'viewer/top_picks.json' \
            'viewer/injuries_*_w*.json' \
            'viewer/snapshots_*_w*.json' \
            'viewer/live_picks_*_w*.json' \
            'viewer/live_odds_feed.json' \
            'viewer/live_odds_feed.manifest.json' \
            'viewer/slate_projections.json' \
            'viewer/slate_projections.csv' \
            'viewer/todays_board.html' 'viewer/todays_board.txt' \
            'viewer/nba_*.json' \
            'viewer/ufc_*.json' \
            'viewer/index.html' viewer/audit.html viewer/verify.html \
            viewer/ledger.html viewer/ledger/index.html \
            current_picks.json top_picks.json slate_projections.json slate_projections.csv \
            src/top_picks.json src/current_picks.json src/slate_projections.json src/slate_projections.csv
          if git diff --quiet && git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): autopilot slate refresh $(date -u +%F) [skip ci]"
          git push
