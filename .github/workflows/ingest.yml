name: ingest

# Propstein 2.0 zero-cost ingest pipeline.
#   games + players: every 15 min — LIVE fetches (ESPN public JSON + nba_api).
#   props: DAILY — re-reads the bundled v1 snapshot live-odds feed
#   (worker/data/live_odds_feed.json, Week 8). This is NOT a live quote
#   source: it is idempotent re-upsert of a static file, kept warm for
#   preview deployments. /api/props labels this to clients as
#   `dataSource: bundled_v1_snapshot`. Replace the snapshot read with a
#   real odds feed before treating props as live.

on:
  schedule:
    - cron: "*/15 * * * *" # games + players (live fetch)
    - cron: "17 10 * * *"  # props (static snapshot re-upsert, daily)
  workflow_dispatch:
    inputs:
      job:
        description: "which ingest to run"
        required: false
        default: all
        type: choice
        options: [all, games, players, props]

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  games-and-players:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install deps
        run: pip install -r worker/requirements.txt

      - name: Selftest (offline)
        run: python worker/selftest.py

      - name: Ingest games (NBA/NFL/NHL)
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest_games.py

      - name: Ingest players (registry + ESPN box, identity merge)
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest_players.py --games 12

  props:
    # Static v1 snapshot re-upsert (see header comment) — daily, not hourly.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 10 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install deps
        run: pip install -r worker/requirements.txt

      - name: Ingest props (static v1 snapshot — not live quotes)
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest_props.py
