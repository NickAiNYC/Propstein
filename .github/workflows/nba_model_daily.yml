name: NBA Model Daily Refresh (stats.nba.com — free)

# The ingestion worker of the free topology: GitHub Actions cron runs the
# nba_model pipeline against the official (keyless) stats.nba.com feeds and
# commits the board/walk-forward artifacts to viewer/feeds/nba_model/ —
# git-as-cache; Vercel serves them statically. No paid API, no database.
#
# Exit semantics: the pipeline is fail-closed. A blocked or throttled run
# fails RED (visible), never silently empty. Publish exit 10 = gates
# REFUSED the board (expected while the model is uncalibrated or no odds
# feed is wired) — the refusal artifact IS the honest artifact, and is
# committed like any other.

on:
  schedule:
    - cron: '30 10 * * *'   # 06:30 ET — refresh after overnight games settle
    - cron: '30 14 * * *'   # 10:30 ET — second pass for late west-coast finales
  workflow_dispatch:        # one-click live validation of the free path

concurrency:
  group: nba-model-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 2026-27 NBA opening night (ET). The window below is capped at 45 days
  # so runtime stays bounded all season.
  SEASON_START: '2026-10-20'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Probe stats.nba.com reachability
        id: probe
        run: |
          # NBA's official feeds block datacenter IPs (empirically confirmed
          # 2026-11-03: stats.nba.com blackholes cloud hosts incl. Actions
          # runners; cdn.nba.com Akamai-403s them — DECISIONS.md D7). Probe
          # cheaply: one offseason-day call, zero box-score follow-ups.
          RESULT=$(PYTHONPATH=. python3 - <<'PY'
          from nba_model.data.nbacom import NbaComProvider
          from nba_model.data.providers import ProviderNetworkError, RateLimitError
          try:
              NbaComProvider().fetch_range(["2026-07-01"])  # offseason: 1 call, 0 games
              print("ok")
          except (ProviderNetworkError, RateLimitError):
              print("blocked")
          PY
          )
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" != "ok" ]; then
            echo "::notice::stats.nba.com is unreachable from datacenter IPs. The free path runs from residential IPs: scripts/nba_model_local_worker.py (cron/launchd on your machine) or a self-hosted runner. Nothing was fetched; nothing will be committed. See src/nba_model/DECISIONS.md D7."
          fi

      - name: Set up Python
        if: steps.probe.outputs.result == 'ok'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        if: steps.probe.outputs.result == 'ok'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run the NBA model pipeline (prepare + publish)
        if: steps.probe.outputs.result == 'ok'
        run: |
          set -euo pipefail
          END=$(TZ=America/New_York date -d 'yesterday' +%F)
          START=$(python3 - "$SEASON_START" "$END" <<'PY'
          import sys
          from datetime import date, timedelta
          season_start = date.fromisoformat(sys.argv[1])
          end = date.fromisoformat(sys.argv[2])
          # rolling 45-day window: covers the 20-game form features with
          # headroom; keeps API calls (and runtime) bounded all season
          print(max(season_start, end - timedelta(days=44)).isoformat())
          PY
          )
          echo "NBA model window: $START .. $END (ET, stats.nba.com free path)"
          PYTHONPATH=. python3 src/nba_model/cli.py prepare --provider nbacom --start "$START" --end "$END"
          set +e
          PYTHONPATH=. python3 src/nba_model/cli.py publish --provider nbacom --start "$START" --end "$END"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then
            echo "publish failed with exit $code"; exit "$code"
          fi

      - name: Stage artifacts for the viewer feed
        if: steps.probe.outputs.result == 'ok'
        run: |
          mkdir -p viewer/feeds/nba_model
          cp src/nba_model/out/nba_board_*.json viewer/feeds/nba_model/ 2>/dev/null || true
          cp src/nba_model/out/nba_board_history.jsonl viewer/feeds/nba_model/ 2>/dev/null || true
          cp src/nba_model/out/nba_walkforward_summary.json viewer/feeds/nba_model/ 2>/dev/null || true
          cp src/nba_model/out/nba_dataset_meta.json viewer/feeds/nba_model/ 2>/dev/null || true
          ls -la viewer/feeds/nba_model/

      - name: Commit and push refreshed artifacts (if changed)
        if: steps.probe.outputs.result == 'ok'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add viewer/feeds/nba_model
          if git diff --staged --quiet; then
            echo "No model artifact changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): NBA model daily refresh $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
