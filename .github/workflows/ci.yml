name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-deploy-contract:
    name: Production v1 deploy contract (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify deployed static site and Vercel output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('vercel.json').read_text())
          if config.get('outputDirectory') != 'viewer':
              raise SystemExit('Vercel must deploy viewer/ while v1 is the production site')
          for name in ('index.html', 'app.js', 'style.css', 'sw.js',
                       'performance/index.html', 'live_odds_feed.json'):
              if not (Path('viewer') / name).is_file():
                  raise SystemExit(f'Missing production v1 asset: viewer/{name}')
          print('Production v1 deployment contract passed')
          PY

  # Foundation freeze (Phase 1) + verification layer (Phase 2): the quant
  # decision contracts, the trust-spine engine, structured logging, and the
  # leakage suite run as their own BLOCKING job so the freeze stays visible
  # even if the broad pytest invocation is ever narrowed. Master prompt §0:
  # leakage tests block deploy.
  foundation-freeze:
    name: Foundation freeze + verification layer (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock
      - name: Install dependencies (locked — fail-closed, never the open ranges)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock pytest
      - name: Contract + verification + logging + leakage suites (blocking)
        run: |
          PYTHONPATH=. pytest tests/test_contracts_quant.py tests/test_player_page_contract.py tests/test_verification_layer.py tests/test_structured_logging.py tests/test_leakage.py tests/test_feature_cutoff.py -q --tb=short

  game-context-provenance:
    name: Game context present at pricing time (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fail if the active week is missing pre-cutoff context
        run: PYTHONPATH=. python scripts/check_game_context_provenance.py

  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runtime
        run: node --version
      - name: Install locked dependencies
        run: npm ci
      - name: Install extension workspace dependencies
        run: npm ci --prefix extensions --ignore-scripts
      - name: Audit extension dependencies (fail on high/critical)
        run: npm audit --prefix extensions --audit-level=high
      - name: Run production readiness gate
        run: npm run check:production

  ledger-verify:
    name: Ledger foundation (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          pip install -r requirements.lock pytest
      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix extensions --ignore-scripts
          npm ci --prefix terminal --ignore-scripts
      - name: make verify
        env:
          LEDGER_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: make verify

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject newly added files over 500 KB
        env:
          SIZE_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_large_files.py
      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies + audit tooling
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          pip install -r requirements.lock pytest pip-audit
      - name: Run pip-audit (fail on high/critical)
        run: python scripts/pip_audit_gate.py
      - name: Run pytest (includes tests/test_dependency_lock.py — lock/spec drift fails here)
        env:
          LEDGER_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          PYTHONPATH=. pytest test/ tests/
