name: Freeze Sunday Early NFL Board

on:
  workflow_dispatch:
  schedule:
    # 12:30 ET in EDT and EST. The script runs only 15–75 minutes before 1 PM ET.
    - cron: '30 16 * * 0'
    - cron: '30 17 * * 0'

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install freeze dependencies
        run: python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'scipy>=1.13' 'statsmodels>=0.14' 'pydantic>=2,<3'
      - name: Check Sunday freeze safety
        run: PYTHONPATH=. python -m unittest tests.test_sunday_freeze
      - name: Freeze 1 PM slate and capture full board
        run: PYTHONPATH=. python scripts/freeze_sunday_early.py
      - name: Commit immutable research records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/ viewer/snapshots_*_w*.json viewer/snapshots_*_w*.manifest.json
          if git diff --cached --quiet; then
            echo "No new Sunday freeze records."
            exit 0
          fi
          git commit -m "chore(freeze): capture Sunday early full board [skip ci]"
          git push
