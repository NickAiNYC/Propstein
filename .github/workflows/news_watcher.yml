name: News Watcher Poll

# The news watcher is a one-shot poll here — scripts/news_watcher.py is a
# persistent-loop program by design, and no host runs that loop today. This
# schedule is the watcher's ONLY host: every 30 minutes it performs one real
# network poll of the upstream feed and commits the resulting heartbeat
# (last_polled_at) so the deployed terminal stops showing an abandoned feed.
#
# Honesty contract:
#   - The heartbeat timestamp is committed only when the fetch actually
#     succeeded (--fail-on-fetch-error makes the run red on upstream failure;
#     a failed run commits nothing, so the site keeps its last VERIFIED-good
#     heartbeat and the 24h feed-abandonment banner can still fire truthfully).
#   - The 300s dead-man switch (autonomous dispatch latch) is intentionally
#     NOT satisfied by this cadence. Dispatch stays suppressed until a real
#     persistent watcher exists. Do not widen the dead-man to "fix" that.

on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  poll-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Poll news feed (real network poll; red on upstream failure)
        run: python scripts/news_watcher.py --once --fail-on-fetch-error

      - name: Publish verified-good heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news_watcher_state.json viewer/news_watcher_state.json public/news_watcher_state.json
          if git diff --cached --quiet; then
            echo "No heartbeat change to publish."
            exit 0
          fi
          git commit -m "chore(data): news watcher heartbeat [skip ci]"
          git push
