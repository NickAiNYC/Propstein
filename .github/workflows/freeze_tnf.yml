name: Freeze Pre-Kickoff Slate Snapshot

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'NFL Season'
        required: false
      week:
        description: 'NFL Week'
        required: false
      game_id:
        description: 'Target Game ID (empty selects the next game in the discovered slate)'
        required: false
      snapshot_type:
        description: 'Snapshot Type'
        required: true
        default: 'pre_kickoff'
        type: choice
        options:
          - pre_kickoff
          - first_published
          - material_revision
          - closing
  schedule:
    # GitHub cron is UTC-only. These cover 30 minutes before a 20:15 ET kickoff
    # in EDT and EST; the resolver below skips the non-matching invocation.
    - cron: '45 23 * * 4'
    - cron: '45 0 * * 5'

jobs:
  freeze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install scipy numpy pandas

      - name: Resolve current slate and kickoff
        id: target
        env:
          INPUT_SEASON: ${{ github.event.inputs.season }}
          INPUT_WEEK: ${{ github.event.inputs.week }}
          INPUT_GAME_ID: ${{ github.event.inputs.game_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/resolve_freeze_target.py >> "$GITHUB_OUTPUT"

      - name: Execute Slate Freeze
        if: steps.target.outputs.should_run == 'true'
        run: |
          SEASON="${{ steps.target.outputs.season }}"
          WEEK="${{ steps.target.outputs.week }}"
          GAME_ID="${{ steps.target.outputs.game_id }}"
          TYPE="${{ github.event.inputs.snapshot_type || 'pre_kickoff' }}"
          
          if [ -n "$GAME_ID" ] && [ "$GAME_ID" != "ALL" ]; then
            python src/freeze_slate.py --season "$SEASON" --week "$WEEK" --game-id "$GAME_ID" --snapshot-type "$TYPE"
          else
            python src/freeze_slate.py --season "$SEASON" --week "$WEEK" --all-games --snapshot-type "$TYPE"
          fi

      - name: Capture prospective full board
        if: steps.target.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event.inputs.snapshot_type == 'pre_kickoff')
        env:
          SEASON: ${{ steps.target.outputs.season }}
          WEEK: ${{ steps.target.outputs.week }}
          GAME_ID: ${{ steps.target.outputs.game_id }}
          KICKOFF: ${{ steps.target.outputs.kickoff }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('/tmp/propstein-kickoffs.json').write_text(json.dumps({os.environ['GAME_ID']: os.environ['KICKOFF']}))
          PY
          JOURNAL="snapshots/full_board_${SEASON}_w${WEEK}_${GAME_ID}.jsonl"
          if [ -e "$JOURNAL" ]; then
            python -m src.prospective_board verify-journal --journal "$JOURNAL"
          else
            python -m src.prospective_board capture \
              --snapshots "snapshots/snapshots_${SEASON}_w${WEEK}.jsonl" \
              --kickoffs /tmp/propstein-kickoffs.json \
              --journal "$JOURNAL" --game-id "$GAME_ID"
          fi

      - name: Commit and push immutable snapshot
        if: steps.target.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/ viewer/snapshots_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(freeze): immutable pre-kickoff snapshot [skip ci]" && git push)
