# PropStein — autonomous daily execution.
#
# Runs the full pipeline every morning (cron 0 11 * * * UTC = 6:00 AM EST /
# 7:00 AM EDT), validates the output, commits the updated run artifacts, and
# triggers a fresh production deployment of propstein.com. Manual one-click
# triggers via workflow_dispatch.
#
# Fail-closed by construction:
#   - `python -m pipeline validate` exits non-zero on empty output, NaN
#     values, or a row count below threshold -> the build fails BEFORE any
#     artifact is committed or deployed.
#   - The Job Summary (report.py -> $GITHUB_STEP_SUMMARY) always renders the
#     sanity-check table, so failures are visible on the run page.

name: Daily model run

on:
  schedule:
    - cron: '0 11 * * *' # 6:00 AM EST / 7:00 AM EDT daily
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Run date (YYYY-MM-DD). Defaults to today (UTC).'
        required: false
        default: ''
      backfill_days:
        description: 'Backfill N consecutive days ending at the run date.'
        required: false
        default: '1'

concurrency:
  group: daily-model-run
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'

jobs:
  pipeline:
    name: Ingest, infer, score, validate, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # persist-credentials lets the artifact commit step push back to the
          # branch that triggered the run.
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Set up Node (cached, for deploy-hook parity)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          pip install pytest

      - name: Run validation suite (unit contracts)
        run: |
          echo "## Unit contracts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m pytest pipeline/tests/ -q 2>&1 | tee /tmp/pytest.log | tail -3 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Execute daily pipeline (ingestion, features, inference, self-scoring)
        id: run
        env:
          PROPSTEIN_FEED_ODDS_URL: ${{ secrets.PROPSTEIN_FEED_ODDS_URL }}
          PROPSTEIN_FEED_ODDS_KEY: ${{ secrets.PROPSTEIN_FEED_ODDS_KEY }}
          PROPSTEIN_FEED_STATS_URL: ${{ secrets.PROPSTEIN_FEED_STATS_URL }}
          PROPSTEIN_FEED_STATS_KEY: ${{ secrets.PROPSTEIN_FEED_STATS_KEY }}
        run: |
          ARGS=""
          RUN_DATE="${{ github.event.inputs.run_date }}"
          BACKFILL="${{ github.event.inputs.backfill_days }}"
          if [ -n "$RUN_DATE" ]; then
            ARGS="$ARGS --date $RUN_DATE"
          fi
          if [ -n "$BACKFILL" ] && [ "$BACKFILL" != "1" ]; then
            ARGS="$ARGS --backfill $BACKFILL"
          fi
          python -m pipeline run $ARGS --fail-on-conflict

      - name: Sanity gate (fail the build on empty / NaN / collapsed output)
        run: python -m pipeline validate

      - name: Regenerate job summary from the latest artifact
        if: always() && steps.run.outcome != 'skipped'
        run: python -m pipeline report
        continue-on-error: true

      - name: Commit and push updated run artifacts
        run: |
          git config user.name "propstein-pipeline-bot"
          git config user.email "pipeline@propstein.com"
          if git diff --quiet -- data/ && [ -z "$(git status --porcelain data/)" ]; then
            echo "No artifact changes to commit." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git add data/
            git commit -m "data: daily model run $(date -u +%F) [skip ci]"
            git push
            echo "Artifacts committed and pushed: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger production deployment (propstein.com)
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" \
              && echo "Deployment triggered." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "VERCEL_DEPLOY_HOOK_URL not configured; skipping deploy trigger (set the secret to enable)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pipeline health summary footer
        if: always()
        run: |
          {
            echo ""
            echo "---"
            echo "_Autonomous run completed at $(date -u '+%Y-%m-%d %H:%M:%SZ'). Descriptive diagnostics only. Not a betting recommendation._"
          } >> "$GITHUB_STEP_SUMMARY"
