name: Daily NBA FanDuel Market Slate

on:
  schedule:
    # 12:00 PM Eastern in EDT and EST; the local-time guard skips the other run.
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

# Keep NBA publishing independent from the NFL autopilot and news watcher.
concurrency:
  group: nba-daily-market-slate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Eastern time
        id: clock
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] || [ "$(TZ=America/New_York date +%H)" = '12' ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.clock.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.clock.outputs.should_run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install NBA contract dependency
        if: steps.clock.outputs.should_run == 'true'
        run: python -m pip install "pydantic>=2,<3"

      - name: Refresh today's NBA market slate
        if: steps.clock.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          NBA_DATE=$(TZ=America/New_York date +%F)
          echo "Refreshing NBA market slate for $NBA_DATE Eastern"
          PYTHONPATH=. python scripts/fetch_nba_odds.py --dates "$NBA_DATE" --max-credits 20
          if [ -f "viewer/nba_games_$NBA_DATE.json" ]; then
            python scripts/publish_nba_market_slate.py "$NBA_DATE"
          else
            echo "No NBA games scheduled for $NBA_DATE Eastern."
          fi

      - name: Commit and push refreshed slate (if changed)
        if: steps.clock.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add viewer/feeds 'viewer/nba_*.json'
          if git diff --staged --quiet; then
            echo "No NBA data changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): NBA daily refresh $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
