name: Daily NBA FanDuel Market Slate

on:
  schedule:
    # Noon Eastern in EDT and EST. Delayed ticks run; the published-date guard skips duplicates.
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

# Keep NBA publishing independent from the NFL autopilot and news watcher.
concurrency:
  group: nba-daily-market-slate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whether today's NBA slate is already published
        id: clock
        run: |
          NBA_DATE=$(TZ=America/New_York date +%F)
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          elif python3 - "$NBA_DATE" <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          day = sys.argv[1]
          odds_path = Path('viewer') / f'nba_odds_{day}.json'
          slate_path = Path('viewer') / f'nba_slate_{day}.json'
          if not odds_path.is_file() or not slate_path.is_file():
              raise SystemExit(1)
          try:
              odds = json.loads(odds_path.read_text())
              observed = datetime.fromisoformat(odds['updated_at'].replace('Z', '+00:00'))
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit(1)
          if odds.get('slate') != day or odds.get('total_quotes', 0) < 1:
              raise SystemExit(1)
          raise SystemExit(0 if observed.astimezone(ZoneInfo('America/New_York')).date().isoformat() == day else 1)
          PY
          then
            echo 'NBA slate already published today; skipping duplicate scheduled run.'
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.clock.outputs.should_run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install NBA contract dependency
        if: steps.clock.outputs.should_run == 'true'
        run: python -m pip install "pydantic>=2,<3"

      - name: Refresh today's NBA market slate
        if: steps.clock.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          NBA_DATE=$(TZ=America/New_York date +%F)
          echo "Refreshing NBA market slate for $NBA_DATE Eastern"
          PYTHONPATH=. python scripts/fetch_nba_odds.py --dates "$NBA_DATE" --max-credits 20
          if [ -f "viewer/nba_games_$NBA_DATE.json" ]; then
            python scripts/publish_nba_market_slate.py "$NBA_DATE"
          else
            echo "No NBA games scheduled for $NBA_DATE Eastern."
          fi

      - name: Commit and push refreshed slate (if changed)
        if: steps.clock.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add viewer/feeds 'viewer/nba_*.json'
          if git diff --staged --quiet; then
            echo "No NBA data changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): NBA daily refresh $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      # Same optional webhook as the odds alarm. Without it a failed day only
      # leaves a red X (NBA lines stopped Nov 8, 2026 with no alert).
      - name: Notify on failure (webhook, optional)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "ALARM_WEBHOOK_URL secret not configured; alarm visible only in Actions history and owner email."
            exit 0
          fi
          MESSAGE="PropStein NBA slate refresh failed (Odds API error or publish failure). ${RUN_URL}"
          curl -fsS -X POST "$ALARM_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"$MESSAGE\", \"text\": \"$MESSAGE\"}" \
            || echo "WARN: webhook POST failed; alarm still recorded in Actions history."
