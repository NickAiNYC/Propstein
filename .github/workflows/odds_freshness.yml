name: Odds Feed Freshness

on:
  schedule:
    # 15-min cadence (audit §d: ~24x redundancy inside the 6h TTL alarm;
    # GitHub demonstrably drops/delays scheduled ticks). Offset :7/:22/:37/:52
    # from news_watcher's :5/:35 to reduce queueing in the shared autopilot
    # concurrency group. The Odds API credits are spent ONLY inside an active
    # slate window (script-side gate); the Polymarket refresh is keyless.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      sweep:
        description: 'Sharp-book sweep mode (bulk The Odds API pull, 2 credits when it fires)'
        type: choice
        default: 'auto'
        options: ['auto', 'force', 'off']

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  refresh-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install contract validator
        run: python -m pip install 'pydantic>=2,<3'

      - name: Refresh public Polymarket observations
        run: python scripts/fetch_polymarket_props.py

      # Book #2 (audit §b.3): sharp sportsbook player props via the bulk
      # The Odds API endpoint (2 credits/sweep), merged into the same feed.
      # Never blocks book #1: every failure path exits 0 and leaves the feed
      # untouched, so the Polymarket snapshot below still publishes. Absent
      # ODDS_API_KEY -> clean skip. No verification stamps: a second book only
      # makes the frozen V3 clause CHECKABLE per market; the engine decides.
      - name: Sweep sharp sportsbook props (The Odds API bulk, optional)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SWEEP_MODE: ${{ inputs.sweep || 'auto' }}
        run: python scripts/fetch_nfl_props_sweep.py --mode "$SWEEP_MODE"

      - name: Check freshness and provenance
        run: python scripts/check_odds_freshness.py --max-age-hours 6

      - name: Cache B1 line history database
        uses: actions/cache@v4
        with:
          path: data/line_history.db
          key: line-history-db-${{ github.run_id }}
          restore-keys: |
            line-history-db-

      - name: Ingest into B1 line history and export static lines
        run: python src/line_history.py --ingest-feed viewer/live_odds_feed.json --export-static

      - name: Publish passing snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add viewer/live_odds_feed.json viewer/live_odds_feed.manifest.json data/polymarket_receipt_log.json viewer/api/lines/
          if git diff --cached --quiet; then
            echo "No new odds snapshot to publish."
            exit 0
          fi
          git commit -m "chore(data): refresh Polymarket odds snapshot and B1 lines [skip ci]"
          git push

      # v205: by default a failed run only emails the repo owner and leaves a red
      # X in the Actions history. This optional step POSTs a failure notice to a
      # webhook of the owner's choice (Discord uses the "content" field, Slack
      # uses "text"; both keys are sent so either receiver works). It is a safe
      # no-op until the owner sets the ALARM_WEBHOOK_URL repository secret.
      - name: Notify on failure (webhook, optional)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "ALARM_WEBHOOK_URL secret not configured; alarm visible only in Actions history and owner email."
            exit 0
          fi
          MESSAGE="PropStein odds freshness alarm: feed stale (>6h), empty (no observed CLOB quotes), or manifest mismatch. See https://github.com/NickAltstein/Propstein/actions/workflows/odds_freshness.yml"
          curl -fsS -X POST "$ALARM_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"$MESSAGE\", \"text\": \"$MESSAGE\"}" \
            || echo "WARN: webhook POST failed; alarm still recorded in Actions history."
